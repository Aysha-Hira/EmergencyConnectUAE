<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register — EmergencyConnectUAE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600&display=swap');
        :root { --bg:#0a0e17; --surface:#111827; --surface2:#1a2235; --border:#1e2d45; --accent:#e63946; --text:#e2e8f0; --text-muted:#64748b; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Source Sans 3',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .container { width:420px; padding:20px; }
        .logo { text-align:center; margin-bottom:32px; }
        .logo-text { font-family:'Rajdhani',sans-serif; font-size:28px; font-weight:700; color:var(--accent); letter-spacing:2px; }
        .logo-sub { font-size:11px; color:var(--text-muted); letter-spacing:3px; text-transform:uppercase; margin-top:4px; }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:32px; }
        .card-title { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:600; margin-bottom:24px; }
        .form-group { margin-bottom:14px; }
        label { display:block; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
        input, select { width:100%; padding:11px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:14px; font-family:'Source Sans 3',sans-serif; outline:none; transition:border-color 0.15s; }
        input:focus, select:focus { border-color:var(--accent); }
        select option { background:var(--surface2); }
        .btn { width:100%; padding:12px; background:var(--accent); color:white; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; font-family:'Source Sans 3',sans-serif; margin-top:8px; transition:background 0.15s; }
        .btn:hover { background:#c1121f; }
        .link { text-align:center; margin-top:20px; font-size:13px; color:var(--text-muted); }
        .link a { color:var(--accent); text-decoration:none; }
        .alert { padding:11px 14px; border-radius:6px; font-size:13px; margin-bottom:16px; display:none; }
        .alert.show { display:block; }
        .alert-error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; }
        .alert-success { background:rgba(16,185,129,0.1); border:1px solid rgba(16,185,129,0.3); color:#6ee7b7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-text">EmergencyConnect</div>
            <div class="logo-sub">UAE Emergency Coordination Platform</div>
        </div>
        <div class="card">
            <div class="card-title">Create Account</div>
            <div class="alert alert-error" id="errorMsg"></div>
            <div class="alert alert-success" id="successMsg"></div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min 8 characters">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="role">
                    <option value="DISPATCHER">Dispatcher</option>
                    <option value="RESPONDER">Responder</option>
                    <option value="HOSPITAL_ADMIN">Hospital Admin</option>
                </select>
            </div>
            <button class="btn" onclick="register()">Create Account</button>
        </div>
        <div class="link">Already have an account? <a href="/login">Sign in</a></div>
    </div>

    <script>
        async function register() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('successMsg').classList.remove('show');

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, role })
                });

                const data = await res.json();

                if (!res.ok) {
                    const el = document.getElementById('errorMsg');
                    el.textContent = data.error || Object.values(data).join(', ');
                    el.classList.add('show');
                    return;
                }

                const s = document.getElementById('successMsg');
                s.textContent = 'Account created! Redirecting to login...';
                s.classList.add('show');
                setTimeout(() => window.location.href = '/login', 1500);

            } catch (e) {
                const el = document.getElementById('errorMsg');
                el.textContent = 'Connection error';
                el.classList.add('show');
            }
        }
    </script>
</body>
</html>
