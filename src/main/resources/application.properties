spring.application.name=EmergencyConnectUAE

#MongoDB config
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=EmergencyConnectUAE

#HTTPS
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=emergencyconnect
server.ssl.key-store-password=${SSL_PASSWORD}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

file.upload-dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Redis Session Storage
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=emergency:session
spring.session.timeout=480m

## uncomment when jwt is added
# jwt.secret=${JWT_SECRET}
