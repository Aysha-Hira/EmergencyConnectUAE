spring.application.name=EmergencyConnectUAE

#HTTPS
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=emergencyconnect
server.ssl.key-store-password=${SSL_PASSWORD}

#MongoDB config
spring.mongodb.uri=${MONGO_URI}

# Redis config - Local connection
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

file.upload-dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Redis Session Storage
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=emergency:session
spring.session.timeout=480m

# JWT - Hardcoded for testing
jwt.secret=f3a9b2c7d1e4f6a8b0c2d4e6f8a1b3c5d7e9f0a2b4c6d8e0f2a4b6c8d0e2f4a6
jwt.expiration=${JWT_EXPIRATION:86400000}

# UAE-specific configuration
uae.emirates.list=Dubai,Abu Dhabi,Sharjah,Ajman,Umm Al Quwain,Ras Al Khaimah,Fujairah
uae.emergency.ambulance=997
uae.emergency.civil_defense=997
uae.emergency.police=999
uae.emergency.coast_guard=996

# Thymeleaf caching disabled
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
