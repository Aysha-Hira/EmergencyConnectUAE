springspring.application.name=EmergencyConnectUAE

# MongoDB config - Direct local connection (NO environment variables)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=EmergencyConnectUAE

# HTTP port (HTTPS disabled for testing)
server.port=8080

# Redis config - Local connection (NO environment variables)
spring.data.redis.host=localhost
spring.data.redis.port=6379

file.upload-dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Redis Session Storage
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=emergency:session
spring.session.timeout=480m

# JWT - Hardcoded for testing (NO environment variables)
jwt.secret=mySecretKeyForJWT123456789012345678901234567890
jwt.expiration=86400000

# UAE-specific configuration
uae.emirates.list=Dubai,Abu Dhabi,Sharjah,Ajman,Umm Al Quwain,Ras Al Khaimah,Fujairah
uae.emergency.ambulance=997
uae.emergency.civil_defense=997
uae.emergency.police=999
uae.emergency.coast_guard=996
